
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b16">
  <title>axeOS 1.3</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="desktop">
    <header class="topbar">
      <div class="brand">axe<span>OS</span></div>
      <div class="topbar-center">Desktop Edition 1.3</div>
      <div class="topbar-right">
        <span id="clock"></span>
        <button id="powerButton" title="Power menu">Power</button>
      </div>
    </header>

    <main id="workspace">
      <div id="desktop-grid" aria-label="Desktop applications"></div>
      <div id="window-layer"></div>
    </main>

    <nav id="dock" aria-label="Application dock">
      <div id="dock-items"></div>
      <div class="dock-separator"></div>
      <button class="dock-special" data-open="appstore">Store</button>
      <button class="dock-special" data-open="settings">Settings</button>
    </nav>

    <div id="folder-overlay" class="overlay hidden">
      <section class="folder-panel">
        <div class="panel-heading">
          <input id="folder-title" aria-label="Folder name" maxlength="30">
          <button id="close-folder" class="close-button">Close</button>
        </div>
        <div id="folder-apps" class="folder-app-grid"></div>
      </section>
    </div>

    <div id="context-menu" class="context-menu hidden"></div>

    <div id="power-menu" class="power-menu hidden">
      <button data-power="restart">Restart desktop</button>
      <button data-power="lock">Lock screen</button>
      <button data-power="cancel">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
